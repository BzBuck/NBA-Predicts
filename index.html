<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Rank and Predict</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-top:#0c1f44; --bg-bot:#091634;
    --card:#f3f1e9; --card-edge:#d9d5c5; --ink:#14243f;
    --cream:#f3f1e9; --cream-dim:#aeb9d0;
    --green:#43b06a; --green-press:#379159;
    --accent:var(--green);
    --line:#33508c; --focus:#ffd54a; --rowH:60px;
  }
  body.wnba{
    --accent:#ff6b00;
    --bg-top:#3d1a00;
    --bg-bot:#220e00;
    --line:#8b4a1a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'M PLUS Rounded 1c',system-ui,sans-serif;
    background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));
    background-attachment:fixed; color:var(--cream); min-height:100vh;
    padding:18px 14px calc(96px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;}

  /* Header */
  header{text-align:center;margin:6px 0 14px;}
  h1{font-family:'M PLUS Rounded 1c',system-ui,sans-serif;font-weight:900;font-size:clamp(28px,8.5vw,46px);line-height:.96;margin:0;color:var(--cream);letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.22);}
  body.wnba h1{text-shadow:0 3px 0 rgba(255,107,0,.5);}
  .sub{font-weight:700;font-size:14px;letter-spacing:.3px;color:var(--cream);margin-top:8px;opacity:.9;}

  /* League toggle */
  .league-toggle{display:inline-flex;background:rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.12);border-radius:999px;padding:3px;margin:10px auto 6px;gap:2px;}
  .league-toggle button{flex:none;appearance:none;border:0;background:transparent;color:var(--cream-dim);font-family:inherit;font-weight:800;font-size:11px;letter-spacing:2px;padding:6px 18px;border-radius:999px;cursor:pointer;transition:.18s;}
  .league-toggle button[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 1px 6px rgba(0,0,0,.3);}
  .league-toggle button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}

  /* Pages */
  .page{display:none;}
  .page.active{display:block;}

  /* Conference toggle */
  .toggle{display:flex;background:rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.1);border-radius:14px;padding:4px;margin:14px 0 10px;}
  .toggle button{flex:1;appearance:none;border:0;background:transparent;color:var(--cream-dim);font-family:inherit;font-weight:800;font-size:15px;letter-spacing:1.2px;padding:13px 0;border-radius:10px;cursor:pointer;transition:.18s;}
  .toggle button[aria-pressed="true"]{background:var(--cream);color:var(--ink);}
  .toggle button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;}

  .hint{font-size:12px;color:var(--cream-dim);margin:8px 2px 14px;line-height:1.45;}

  /* Standings list */
  .list{position:relative;}
  .row{position:relative;display:flex;align-items:center;gap:10px;height:var(--rowH);margin-bottom:9px;user-select:none;}
  .seed{width:30px;flex:none;text-align:right;font-weight:800;font-size:21px;font-variant-numeric:tabular-nums;color:var(--cream);}
  .card{flex:1;display:flex;align-items:center;gap:11px;height:100%;background:var(--card);border:1px solid var(--card-edge);border-radius:12px;padding:0 8px 0 9px;box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .badge{width:34px;height:34px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;}
  .logo{width:34px;height:34px;object-fit:contain;display:block;}
  .chip{position:absolute;inset:0;border-radius:8px;display:none;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;letter-spacing:.3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
  .name{flex:1;color:var(--ink);font-weight:700;font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nudge{display:flex;flex-direction:column;flex:none;}
  .nudge button{appearance:none;border:0;background:transparent;color:#8b93a6;cursor:pointer;width:30px;height:24px;display:flex;align-items:center;justify-content:center;padding:0;}
  .nudge button:active{color:var(--ink);}
  .nudge button:disabled{opacity:.25;cursor:default;}
  .nudge svg{width:16px;height:16px;}
  .grip{flex:none;width:40px;height:100%;display:flex;align-items:center;justify-content:center;color:#9aa1b2;cursor:grab;touch-action:none;}
  .grip:active{cursor:grabbing;}
  .grip svg{width:20px;height:20px;pointer-events:none;}
  .row.dragging{z-index:999;box-shadow:none;}
  .row.dragging .card{box-shadow:0 14px 30px rgba(0,0,0,.45);transform:scale(1.015);border-color:#fff;}
  .placeholder{height:var(--rowH);margin-bottom:9px;border-radius:12px;border:2px dashed #3a59a0;background:rgba(58,89,160,.12);}
  .cut{margin-bottom:30px;}
  .cut::after{content:attr(data-line);position:absolute;left:40px;right:0;bottom:-20px;height:0;font-size:9px;font-weight:800;letter-spacing:2px;text-align:right;padding-top:2px;line-height:0;}
  .cut-dotted::after{border-top:2px dotted #7c8db5;color:#7c8db5;}
  .cut-solid::after{border-top:2px solid #3a4f7d;color:var(--cream-dim);}

  /* Bracket */
  .bk-section-title{font-weight:800;font-size:13px;letter-spacing:1.5px;color:var(--cream-dim);text-transform:uppercase;margin:18px 2px 10px;}
  .bk-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:6px;}
  .bk{position:relative;display:flex;gap:32px;width:max-content;height:540px;}
  .bk-col{width:118px;display:flex;flex-direction:column;justify-content:space-around;flex:none;}
  .bk-match{height:112px;display:flex;flex-direction:column;justify-content:center;gap:8px;position:relative;z-index:1;}
  .bk-team{height:38px;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--card-edge);border-radius:9px;padding:0 7px;cursor:default;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:.12s;overflow:hidden;}
  .bk-team.pickable{cursor:pointer;}
  .bk-team.pickable:active{transform:scale(.97);}
  .bk-team.won{outline:2px solid var(--accent);outline-offset:-1px;}
  .bk-team.lost{opacity:.42;}
  .bk-team.empty{background:rgba(255,255,255,.05);border:1px dashed rgba(255,255,255,.15);box-shadow:none;justify-content:center;}
  .bk-seed{font-size:11px;font-weight:800;color:#7a849b;width:13px;text-align:center;flex:none;font-variant-numeric:tabular-nums;}
  .bk-logo{width:22px;height:22px;flex:none;position:relative;display:flex;align-items:center;justify-content:center;}
  .bk-logo img{width:22px;height:22px;object-fit:contain;display:block;}
  .bk-chip{position:absolute;inset:0;border-radius:5px;display:none;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:8px;}
  .bk-name{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bk-wait{font-size:11px;color:#5f6f95;font-weight:600;}
  svg.bk-lines{position:absolute;top:0;left:0;pointer-events:none;z-index:0;overflow:visible;}
  .bk-line{fill:none;stroke:var(--line);stroke-width:2;}

  /* Finals / Champion */
  .finals{display:flex;flex-direction:column;align-items:center;gap:14px;margin:8px 0 10px;}
  .finals-row{display:flex;align-items:stretch;gap:12px;width:100%;max-width:440px;}
  .finals .bk-team{height:54px;flex:1;border-radius:12px;}
  .finals .bk-name{font-size:15px;}
  .finals .bk-logo,.finals .bk-logo img{width:26px;height:26px;}
  .finals-vs{display:flex;align-items:center;font-weight:900;color:var(--cream-dim);font-size:14px;}
  .champ-banner{width:100%;max-width:440px;text-align:center;background:linear-gradient(180deg,#16315f,#102447);border:1px solid #2f4f8f;border-radius:16px;padding:16px;}
  body.wnba .champ-banner{background:linear-gradient(180deg,#4a2200,#2e1400);border-color:#a05020;}
  .champ-label{font-size:11px;letter-spacing:2px;font-weight:800;color:#ffd54a;}
  .champ-team{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:9px;font-weight:800;font-size:20px;color:var(--cream);}
  .champ-logo{width:36px;height:36px;position:relative;display:inline-flex;align-items:center;justify-content:center;flex:none;}
  .champ-logo img{width:36px;height:36px;object-fit:contain;}
  .champ-logo .bk-chip{font-size:11px;border-radius:8px;}
  .champ-empty{color:var(--cream-dim);font-size:13px;margin-top:9px;font-weight:600;}

  /* All-Stars */
  .as-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 4px;}
  .as-count{font-size:12px;font-weight:700;color:var(--cream-dim);}
  .as-source{font-size:11px;font-weight:700;color:#6f7ea3;}
  .as-group-title{font-weight:800;font-size:12px;letter-spacing:1.5px;color:var(--cream-dim);text-transform:uppercase;margin:14px 2px 8px;}
  .as-slot{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--card-edge);border-radius:12px;padding:0 8px 0 10px;height:54px;margin-bottom:8px;cursor:pointer;transition:.12s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .as-slot:active{transform:scale(.99);}
  .as-slot.empty{background:rgba(255,255,255,.05);border:1px dashed #33508c;box-shadow:none;}
  .as-pos{flex:none;font-size:10px;font-weight:800;letter-spacing:.5px;color:#fff;background:#2c477f;border-radius:6px;padding:5px 0;width:82px;text-align:center;}
  body.wnba .as-pos{background:#b05a1a;}
  .as-logo{flex:none;width:28px;height:28px;position:relative;display:flex;align-items:center;justify-content:center;}
  .as-logo img{width:28px;height:28px;object-fit:contain;display:block;}
  .as-initials{flex:none;width:28px;height:28px;border-radius:7px;background:#46557a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;}
  .as-name{flex:1;color:var(--ink);font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .as-empty-label{flex:1;color:#6f7ea3;font-weight:600;font-size:14px;}
  .as-plus{flex:none;color:#7c8db5;font-size:22px;font-weight:700;width:30px;text-align:center;}
  .as-clear{flex:none;width:30px;height:30px;border:0;background:transparent;color:#9aa1b2;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .as-clear:active{background:rgba(0,0,0,.06);color:var(--ink);}
  .as-clear svg{width:16px;height:16px;}

  /* Picker sheet */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(4,9,22,.55);z-index:1800;opacity:0;pointer-events:none;transition:.2s;}
  .sheet-backdrop.show{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:1900;background:#0e2147;border-top:1px solid #2c477f;border-radius:18px 18px 0 0;max-height:78vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .24s ease;padding-bottom:env(safe-area-inset-bottom);}
  body.wnba .sheet{background:#2e1800;border-top-color:#a05020;}
  .sheet.show{transform:translateY(0);}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;}
  .sheet-title{flex:1;font-weight:800;font-size:15px;color:var(--cream);}
  .sheet-close{flex:none;width:32px;height:32px;border:0;background:#1a2e54;color:var(--cream);border-radius:9px;cursor:pointer;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .sheet-search{margin:0 16px 10px;}
  .sheet-search input{width:100%;box-sizing:border-box;background:#0a1733;border:1px solid #2c477f;border-radius:10px;color:var(--cream);font-family:inherit;font-size:15px;padding:11px 12px;outline:none;}
  body.wnba .sheet-search input{background:#1e1000;border-color:#a05020;}
  .sheet-search input:focus{border-color:var(--accent);}
  .sheet-search input::placeholder{color:#5f6f95;}
  .sheet-list{overflow-y:auto;padding:0 12px 14px;-webkit-overflow-scrolling:touch;}
  .cand{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;}
  .cand:active{background:rgba(255,255,255,.06);}
  .cand-name{flex:1;color:var(--cream);font-weight:600;font-size:15px;}
  .cand-team{font-size:11px;color:var(--cream-dim);font-weight:700;}
  .cand-add{display:flex;align-items:center;gap:8px;padding:11px 8px;border-radius:10px;cursor:pointer;color:var(--accent);font-weight:700;font-size:15px;}
  .cand-add:active{background:rgba(255,255,255,.06);}
  .cand-add svg{width:18px;height:18px;flex:none;}
  .cand-empty{color:var(--cream-dim);font-size:13px;padding:12px 8px;text-align:center;}

  /* Tab bar */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:1500;display:flex;background:#081430;border-top:1px solid #22386b;padding-bottom:env(safe-area-inset-bottom);}
  body.wnba .tabbar{background:#1e1000;border-top-color:#7a3a10;}
  .tabbar button{flex:1;appearance:none;border:0;background:transparent;color:var(--cream-dim);font-family:inherit;font-weight:700;font-size:12px;letter-spacing:.4px;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;}
  .tabbar button svg{width:22px;height:22px;}
  .tabbar button.active{color:var(--cream);}
  .tabbar button.active::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:46px;height:3px;border-radius:0 0 3px 3px;background:var(--accent);}
  .tabbar button:focus-visible{outline:3px solid var(--focus);outline-offset:-3px;}


  /* Awards */
  .aw-section-title{font-weight:800;font-size:12px;letter-spacing:1.5px;color:var(--cream-dim);text-transform:uppercase;margin:18px 2px 10px;}
  .aw-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--card-edge);border-radius:12px;padding:0 8px 0 10px;height:58px;margin-bottom:8px;cursor:pointer;transition:.12s;box-shadow:0 1px 2px rgba(0,0,0,.25);}
  .aw-row:active{transform:scale(.99);}
  .aw-row.empty{background:rgba(255,255,255,.05);border:1px dashed #33508c;box-shadow:none;}
  .aw-trophy{flex:none;font-size:20px;width:34px;text-align:center;}
  .aw-label{flex:none;font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--cream-dim);width:110px;}
  .aw-pick{flex:1;display:flex;align-items:center;gap:8px;overflow:hidden;}
  .aw-name{font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .aw-team{font-size:11px;font-weight:700;color:#6f7ea3;}
  .aw-empty-label{flex:1;color:#6f7ea3;font-weight:600;font-size:14px;}
  .aw-plus{flex:none;color:#7c8db5;font-size:22px;font-weight:700;width:30px;text-align:center;}
  .aw-clear{flex:none;width:30px;height:30px;border:0;background:transparent;color:#9aa1b2;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .aw-clear:active{background:rgba(0,0,0,.06);color:var(--ink);}
  .aw-clear svg{width:16px;height:16px;}
  /* Export */
  header{position:relative;}
  .league-row{position:relative;text-align:center;}
  @media (max-width:370px){ .league-row{display:flex;flex-direction:column-reverse;align-items:center;} .league-row .export-btn{position:static;transform:none;margin:0 0 6px;} }
  .export-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);appearance:none;border:0;background:rgba(255,255,255,.1);color:var(--cream);border-radius:999px;padding:7px 12px;font-family:inherit;font-weight:800;font-size:11px;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;gap:5px;}
  .export-btn:active{background:rgba(255,255,255,.2);}
  .export-btn svg{width:14px;height:14px;}
  .export-toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-weight:800;font-size:13px;padding:10px 20px;border-radius:999px;z-index:3000;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}
  .export-toast.show{opacity:1;}
  /* Export stage (off-screen) */
  .xs{position:fixed;left:-20000px;top:0;padding:24px 28px 28px;background:linear-gradient(180deg,var(--bg-top),var(--bg-bot));color:var(--cream);font-family:'M PLUS Rounded 1c',system-ui,sans-serif;width:max-content;}
  .xs-head{text-align:center;margin-bottom:18px;}
  .xs-title{font-weight:900;font-size:30px;line-height:1.1;}
  .xs-sub{font-weight:700;font-size:13px;color:var(--cream-dim);margin-top:4px;}
  .xs-cols{display:flex;gap:28px;align-items:flex-start;}
  .xs-col{width:360px;flex:none;}
  .xs-col-title{font-weight:900;font-size:15px;letter-spacing:1px;text-transform:uppercase;color:var(--cream);margin:0 2px 10px;}
  .xs-foot{margin-top:8px;max-width:520px;margin-left:auto;margin-right:auto;}
  .xs .bk-scroll{overflow:visible;}
  .xs .nudge,.xs .grip,.xs .aw-clear,.xs .as-clear,.xs .aw-plus,.xs .as-plus,.xs .aw-ru-toggle{display:none !important;}
  .xs .bk-games button:not(.on){display:none;}
  .xs .aw-row,.xs .as-slot,.xs .card{box-shadow:none;}
  .xs .xs-col{width:400px;}
  .xs .bk-col{width:150px;}
  .xs .bk.rev{flex-direction:row-reverse;}
  .xs .xs-center{width:380px;}
  .xs .xs-center .finals-row{flex-direction:column;gap:8px;}
  .xs .xs-center .finals-vs{justify-content:center;}
  .xs .xs-center .finals .bk-team{flex:none;height:48px;}
  .xs .xs-center .aw-label{display:none;}
  .xs .xs-center .bk-section-title{text-align:center;}
  .xs .aw-label{width:auto;margin-right:6px;}
  .xs .aw-row:has(.aw-pos-label) .aw-label{display:none;}
  .xs .aw-name,.xs .as-name,.xs .bk-name,.xs .name{overflow:visible;text-overflow:clip;}
  /* Series length chips */
  .bk-games{display:flex;gap:4px;justify-content:center;}
  .bk-games button{appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.25);color:var(--cream-dim);font-family:inherit;font-weight:800;font-size:10px;width:24px;height:20px;border-radius:6px;cursor:pointer;padding:0;}
  .bk-games button.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .bk-games-lbl{font-size:9px;font-weight:800;letter-spacing:.6px;color:var(--cream-dim);align-self:center;margin-right:2px;}
  .bk-in{font-size:10px;font-weight:800;color:var(--accent);margin-left:auto;flex:none;}
  .champ-in{font-size:12px;font-weight:700;color:var(--cream-dim);margin-top:4px;}
  /* Award runner-ups */
  .aw-ru-toggle{display:block;margin:-2px 0 10px auto;appearance:none;border:0;background:transparent;color:var(--cream-dim);font-family:inherit;font-weight:700;font-size:11px;letter-spacing:.3px;cursor:pointer;padding:2px 4px;}
  .aw-ru-toggle:active{color:var(--cream);}
  .aw-row.ru{height:46px;margin-left:24px;}
  .aw-row.ru .aw-trophy{font-size:12px;font-weight:800;color:var(--cream-dim);}
  .aw-row.ru.empty .aw-trophy{color:#6f7ea3;}
  /* All-team grid */
  .aw-team-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
  .aw-team-grid .aw-row{grid-column:span 2;}
  .aw-pos-label{flex:none;font-size:10px;font-weight:800;letter-spacing:.3px;color:#fff;background:#2c477f;border-radius:6px;padding:5px 0;width:36px;text-align:center;}
  body.wnba .aw-pos-label{background:#8a4a1d;}

  /* Share */
  .share-btn{position:absolute;right:0;top:50%;transform:translateY(-50%);appearance:none;border:0;background:rgba(255,255,255,.1);color:var(--cream);border-radius:10px;padding:8px 12px;font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .share-btn:active{background:rgba(255,255,255,.2);}
  .share-btn svg{width:16px;height:16px;}
  header{position:relative;}

  .share-url{display:flex;gap:8px;margin-bottom:12px;}
  .share-url input{flex:1;background:#071228;border:1px solid #2c477f;border-radius:10px;color:var(--cream);font-family:inherit;font-size:12px;padding:11px 12px;outline:none;min-width:0;}
  body.wnba .share-url input{background:#150d04;border-color:#a05020;}
  .share-copy-btn{appearance:none;border:0;background:var(--accent);color:#fff;font-family:inherit;font-weight:800;font-size:14px;padding:11px 18px;border-radius:10px;cursor:pointer;white-space:nowrap;}
  .share-copy-btn:active{opacity:.85;}

  async function fetchLiveRosters(lg){
    const base=`https://site.api.espn.com/apis/site/v2/sports/basketball/${CONFIG[lg].espn}`;
    const posToGF=ab=>/^(G|PG|SG)/i.test(ab||'')?'G':'F';
    const keys=CONFIG[lg].confs.map(c=>c.key);
    const single=keys.length===1?keys[0]:null;
    const next={}; keys.forEach(k=>next[k]=[]);
    const nextCoaches=[];
    try{
      const results=await Promise.allSettled(
        ESPN_IDS[lg].map(([abbr,id])=>
          fetch(`${base}/teams/${id}/roster`).then(r=>r.json()).then(j=>({abbr,j}))
        )
      );
      results.forEach(r=>{
        if(r.status!=='fulfilled'||!r.value?.j) return;
        const{abbr,j}=r.value;
        const cf=single||(TEAMS[lg][abbr]?.conf); if(!cf) return;
        let aths=j.athletes||[];
        if(aths.length&&aths[0]?.items) aths=aths.flatMap(g=>g.items||[]);
        aths.forEach(a=>{
          const name=a.fullName||a.displayName; if(!name) return;
          const pa=a.position?.abbreviation||a.position?.name||'';
          next[cf].push({n:name,t:abbr,p:posToGF(pa)});
        });
        // Extract head coach from same response
        const coaches=j.coach||[];
        const hc=coaches[0]; // first entry is head coach
        if(hc){
          const name=`${hc.firstName||''} ${hc.lastName||''}`.trim();
          if(name) nextCoaches.push({n:name,t:abbr,p:'COACH'});
        }
      });
      if(keys.every(k=>next[k].length>5)){
        keys.forEach(k=>next[k].sort((a,b)=>a.n.localeCompare(b.n)));
        CONFIG[lg].players=next;
        COACHES[lg]=nextCoaches.sort((a,b)=>a.n.localeCompare(b.n));

        if(src) src.textContent='✓ Live rosters · '+new Date().toLocaleDateString();
        if(page==='allstars'&&lg===league){ renderAllstars(); if(pickerCtx) fillCandidates(sheetSearch.value||''); }
        if(page==='awards'&&lg===league) renderAwards();
        return true;
      }
    }catch(e){}
    return false;
  }

  function flip(mutate){

  const winnerOf=(id,parts)=>{ const p=picks[id]; return (p&&parts.includes(p))?p:null; };
  function computeConf(cf){
    const pre=`${league}-${cf}`, s=order[league][cf];
    const r1=[[s[0],s[7]],[s[3],s[4]],[s[2],s[5]],[s[1],s[6]]];
    const m={};
    r1.forEach((parts,i)=>{ const id=`${pre}-r1m${i}`; m[id]={parts,winner:winnerOf(id,parts)}; });
    [["r1m0","r1m1"],["r1m2","r1m3"]].forEach((pair,i)=>{
      const parts=[m[`${pre}-${pair[0]}`].winner, m[`${pre}-${pair[1]}`].winner];
      const id=`${pre}-r2m${i}`; m[id]={parts,winner:winnerOf(id,parts.filter(Boolean))};
    });
    { const parts=[m[`${pre}-r2m0`].winner,m[`${pre}-r2m1`].winner];
      const id=`${pre}-r3m0`; m[id]={parts,winner:winnerOf(id,parts.filter(Boolean))}; }
    m.champ=m[`${pre}-r3m0`].winner;
    return m;

  // Best-of length per round: NBA all best-of-7; WNBA first round 3, semis 5, finals 7
  function seriesLen(matchId){
    if(league==="nba") return 7;
    if(matchId.endsWith("FINALS")||/-r3m/.test(matchId)) return 7;
    if(/-r2m/.test(matchId)) return 5;
    return 3;
  }
  function gamesFor(matchId){

    return (g && g>=Math.ceil(n/2) && g<=n) ? g : null;
  }
  function gamesRow(matchId){

  function drawConnectors(bk){
    const old=bk.querySelector("svg.bk-lines"); if(old) old.remove();
    const pairs=[["r1m0","r2m0"],["r1m1","r2m0"],["r1m2","r2m1"],["r1m3","r2m1"],["r2m0","r3m0"],["r2m1","r3m0"]];
    const base=bk.getBoundingClientRect();
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("class","bk-lines");
    svg.setAttribute("width", bk.scrollWidth); svg.setAttribute("height", bk.clientHeight);
    pairs.forEach(([from,to])=>{
      const fe=bk.querySelector(`[data-m="${from}"]`), te=bk.querySelector(`[data-m="${to}"]`);
      if(!fe||!te) return;
      const fr=fe.getBoundingClientRect(), tr=te.getBoundingClientRect();
      const rev=bk.classList.contains('rev');
      const x1=(rev?fr.left:fr.right)-base.left+bk.scrollLeft, y1=fr.top+fr.height/2-base.top;
      const x2=(rev?tr.right:tr.left)-base.left+bk.scrollLeft,  y2=tr.top+tr.height/2-base.top;
      const mx=(x1+x2)/2;
      const p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.setAttribute("d",`M${x1},${y1} H${mx} V${y2} H${x2}`); p.setAttribute("class","bk-line");
      svg.appendChild(p);
    });
    bk.insertBefore(svg, bk.firstChild);
  }

  // Exports only the current tab. Builds a clean off-screen layout (filled picks only,

  let h2cReady=null;
  function loadH2C(){
    if(h2cReady) return h2cReady;
    h2cReady=new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';

  function xCol(title){ const c=el('div','xs-col'); if(title) c.appendChild(el('div','xs-col-title',title)); return c; }

  function exportStandings(){
    const cols=[];
    const cuts=CONFIG[league].cutlines;
    CONFIG[league].confs.forEach(cf=>{
      const col=xCol(CONFIG[league].confs.length>1?SECTION_TITLE[cf.key]:'Standings');
      order[league][cf.key].forEach((abbr,i)=>{
        const row=makeRow(abbr); row.querySelector('.seed').textContent=i+1;
        const cl=cuts.find(c=>c.after===i+1);
        if(cl){ row.classList.add('cut', cl.style==='dotted'?'cut-dotted':'cut-solid'); row.dataset.line=cl.label; }
        col.appendChild(row);
      });
      cols.push(col);
    });
    return {cols};
  }
  function exportBracket(){
    renderBracket();
    const body=document.getElementById('bracket-body');
    const kids=[...body.children];
    const cols=[], below=[];
    // Conference brackets: title + scroll pairs go side by side
    for(let i=0;i<kids.length;i++){
      if(kids[i].classList.contains('bk-section-title') && kids[i+1]?.classList.contains('bk-scroll')){
        const col=xCol(); col.style.width='auto'; col.style.flex='none';
        col.appendChild(kids[i].cloneNode(true)); col.appendChild(kids[i+1].cloneNode(true));
        cols.push(col); i++;
      } else below.push(kids[i].cloneNode(true));
    }
    if(!CONFIG[league].finals){
      // WNBA: champion + FMVP sit in a column beside the single bracket
      const side=xCol(); below.forEach(n=>side.appendChild(n)); cols.push(side);
      return {cols};
    }
    // Traditional layout: West flows right, Finals in the middle, East mirrored flowing left
    const center=xCol(); center.classList.add('xs-center'); below.forEach(n=>center.appendChild(n));
    const east=cols[1];
    east.querySelector('.bk').classList.add('rev');
    east.querySelector('.bk-section-title').style.textAlign='right';
    return {cols:[cols[0], center, east], centered:true};
  }
  function exportAllstars(){
    const cols=[], saved=asConf;
    CONFIG[league].confs.forEach(cf=>{
      asConf=cf.key;
      const col=xCol(CONFIG[league].confs.length>1?SECTION_TITLE[cf.key]:'All-Stars');
      let g=null, any=false;
      CONFIG[league].asSlots.forEach(slot=>{
        if(!allstars[league][cf.key][slot.id]) return;
        if(slot.g!==g){ g=slot.g; col.appendChild(xSection(g)); }
        col.appendChild(asSlotRow(slot)); any=true;
      });
      if(any) cols.push(col);
    });
    asConf=saved;
    return {cols};
  }
  function exportAwards(){
    const cfg=AWARDS_CONFIG[league], A=awards[league];
    const ind=xCol('Individual Awards');
    let anyInd=false;
    cfg.individual.forEach(aw=>{
      if(A[aw.id]){ ind.appendChild(awRow(aw.id,aw.label,aw.emoji,aw.pos)); anyInd=true; }
      if(A[aw.id+'_2']){ ind.appendChild(awRow(aw.id+'_2',aw.label,'2nd',aw.pos,true)); anyInd=true; }
      if(A[aw.id+'_3']){ ind.appendChild(awRow(aw.id+'_3',aw.label,'3rd',aw.pos,true)); anyInd=true; }
    });
    const lg=xCol(league==='nba'?'All-NBA':'All-WNBA'), def=xCol('All-Defensive');
    let anyLg=false, anyDef=false;
    const posLabels={G:'Guard',F:'Forward/Center',ANY:'Player'};
    cfg.allteams.forEach(team=>{
      const filled=team.slots.filter(s=>A[s.id]); if(!filled.length) return;
      const isDef=/Defensive/.test(team.team), col=isDef?def:lg;
      col.appendChild(xSection(team.team));
      filled.forEach(s=>col.appendChild(awRow(s.id,posLabels[s.pos]||s.pos,null,s.pos)));
      if(isDef) anyDef=true; else anyLg=true;
    });
    return {cols:[anyInd&&ind, anyLg&&lg, anyDef&&def].filter(Boolean)};
  }

  async function doExport(){
    const builders={standings:exportStandings, bracket:exportBracket, allstars:exportAllstars, awards:exportAwards};
    const titles={standings:'Standings', bracket:'Playoffs', allstars:'All-Stars', awards:'Awards'};
    const {cols,foot,centered}=builders[page]();
    if(!cols.length){ showExportToast('Nothing picked on this tab yet'); return; }
    showExportToast('Building image…',15000);
    const h2c=await loadH2C().catch(()=>null);
    if(!h2c){ showExportToast('⚠ Could not load image library'); return; }

    const stage=el('div','xs');
    const hd=el('div','xs-head');
    hd.appendChild(el('div','xs-title',`${CONFIG[league].label} ${titles[page]}`));
    stage.appendChild(hd);
    const row=el('div','xs-cols'); if(centered) row.style.alignItems='center';
    cols.forEach(c=>row.appendChild(c)); stage.appendChild(row);
    if(foot) stage.appendChild(foot);
    document.body.appendChild(stage);
    // Redraw bracket connector lines inside the clone at their new positions
    stage.querySelectorAll('.bk').forEach(drawConnectors);
    await document.fonts?.ready;
    const bg=getComputedStyle(document.body).getPropertyValue('--bg-top').trim()||'#0c1f44';
    try{
      const canvas=await h2c(stage,{backgroundColor:bg, scale:2, useCORS:true, logging:false});
      const a=document.createElement('a');
      a.download=`${league}-${page}.png`; a.href=canvas.toDataURL('image/png'); a.click();
      showExportToast('✓ Image saved!');
    } finally { stage.remove(); }
  }
  document.getElementById('export-btn').addEventListener('click', ()=>{
    doExport().catch(()=>showExportToast('⚠ Export failed'));
  });

  (async () => {
    await load();
    document.body.classList.toggle("wnba", league==="wnba");
    current=CONFIG[league].confs[0].key; asConf=CONFIG[league].confs[0].key;
    buildLeagueToggle(); applyWordmark();
    setPage("standings");
    fetchLiveRosters("nba");
    fetchLiveRosters("wnba");
  })();
})();
</script>
</body>
</html>
